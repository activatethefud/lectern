services:
  app:
    build:
      context: .
      target: runtime
    image: slide-course:latest
    container_name: slide-course
    ports:
      - "8765:3000"
    environment:
      NUXT_COURSE_ROOT: /app/courses
      NUXT_DATA_DIR: /data
      # certificate dates/times are rendered in this zone
      TZ: ${TZ:-Europe/Belgrade}
      # set in production: keeps certificate signatures valid if the data volume is lost
      NUXT_CERTIFICATE_SECRET: ${CERTIFICATE_SECRET:-}
    volumes:
      # attempts + certificates db; survives image rebuilds
      - course-data:/data
      # uncomment to add courses without rebuilding the image
      # - ./courses:/app/courses:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s

  # Re-bake slide images from the .pptx decks, then commit the result.
  #   docker compose run --rm bake
  #   docker compose run --rm bake npm run bake -- <slug>
  bake:
    profiles: ["tools"]
    build:
      context: .
      target: bake
    volumes:
      - ./courses:/app/courses

volumes:
  course-data:
